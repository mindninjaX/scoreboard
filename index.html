<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="robots" content="noindex">
<title>Scoreboard</title>
<style>
:root{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --line:#2c2c2a; --axis:#383835;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --ring:rgba(255,255,255,0.10);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --paid:#5f5e5a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{padding:0 0 64px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:20;background:rgba(13,13,13,0.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:14px;padding-bottom:14px}
.brand .title{font-size:17px;font-weight:650;letter-spacing:-0.01em}
.brand .north{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px}
.primary{background:var(--ink);color:#0d0d0d;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.ghost{background:transparent;border:1px solid var(--ring);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink-2)}
.ghost:hover{border-color:rgba(255,255,255,0.22);color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-top:20px}
.card,.now-grid > *,.week-grid > *{min-width:0}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:18px;padding:20px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h2{font-size:12px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.sub{font-size:13px;color:var(--ink-2)}
.muted{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid transparent}
.pill.good{color:var(--good);border-color:rgba(12,163,12,0.35)}
.pill.warn{color:var(--warn);border-color:rgba(250,178,25,0.35)}
.pill.late{color:var(--serious);border-color:rgba(236,131,90,0.4)}
.pill.idle{color:var(--muted);border-color:var(--ring)}

/* now */
.now-grid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:24px}
.today-date{font-size:30px;font-weight:650;letter-spacing:-0.02em;line-height:1.1}
.today-meta{margin-top:10px;display:grid;gap:6px;font-size:13px;color:var(--ink-2)}
.big{font-size:44px;font-weight:650;letter-spacing:-0.03em;line-height:1}
.big small{font-size:16px;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:6px}
.blocks{display:grid;gap:14px}
.bgroup-h{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.blk{position:relative;background:var(--surface-2);border:1px solid var(--ring);border-radius:12px;padding:10px 12px 10px 14px;min-width:150px;flex:1}
.blk::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--bc)}
.blk .t{font-size:12px;color:var(--muted)}
.blk .n{font-size:15px;font-weight:600;margin-top:3px}
.blk .x{font-size:12px;color:var(--ink-2);margin-top:2px}
.blk.on{border-color:var(--bc);box-shadow:0 0 0 1px var(--bc) inset}
.blk .tag{position:absolute;top:9px;right:10px;font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink)}
.blk.done{opacity:0.55}
.tbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:4px}
.tbar .l{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:6px}
.tbar .l span:last-child{color:var(--ink-2);font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--bc)}
.rest{font-size:15px;color:var(--ink-2);line-height:1.5}

/* week */
.week-grid{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:24px;align-items:start}
.weekchart{min-height:170px}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:18px}
.tile{background:var(--surface-2);border:1px solid var(--ring);border-radius:14px;padding:12px 14px}
.tile .h{display:flex;align-items:center;font-size:12px;color:var(--ink-2);min-height:18px}
.tile .v{font-size:26px;font-weight:650;letter-spacing:-0.02em;margin:8px 0 8px}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.tile .track{margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center}

/* roadmap */
.rm-scroll{overflow-x:auto;margin:0 -20px;padding:0 20px;-webkit-overflow-scrolling:touch}
.rm{display:grid;grid-template-columns:120px repeat(var(--cols),minmax(190px,1fr));gap:8px;min-width:calc(120px + var(--cols) * 198px)}
.rm-h{padding:8px 10px;border-radius:10px;font-size:13px}
.rm-h b{display:block;font-weight:650}
.rm-h span{font-size:11px;color:var(--muted)}
.rm-h.cur{background:var(--surface-2);box-shadow:0 0 0 1px var(--ring) inset}
.rm-h.cur span{color:var(--ink)}
.rm-h.past{opacity:0.55}
.rm-t{display:flex;align-items:center;font-size:14px;font-weight:600;padding:10px 4px}
.rm-c{background:var(--surface-2);border:1px solid var(--ring);border-radius:12px;padding:6px;display:grid;gap:2px;align-content:start;min-height:52px}
.rm-c.cur{border-color:rgba(255,255,255,0.2)}
.ms{display:flex;gap:9px;align-items:flex-start;text-align:left;background:transparent;border:0;border-radius:8px;padding:7px 6px;font-size:13px;line-height:1.35;color:var(--ink-2);width:100%}
button.ms:hover{background:rgba(255,255,255,0.04)}
.ms .box{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--muted);margin-top:1px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#0d0d0d}
.ms.done{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.25)}
.ms.done .box{background:var(--good);border-color:var(--good)}
.ms.late .txt{color:var(--serious)}
.ms.late .box{border-color:var(--serious)}
.ms .auto{display:block;font-size:11px;color:var(--muted);text-decoration:none;margin-top:2px;font-variant-numeric:tabular-nums}
.ms.auto-ms .box{border-style:dashed}

/* forecast */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--ring);border-radius:999px;padding:3px}
.seg button{background:transparent;border:0;border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#0d0d0d;font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:var(--surface-2);border:1px solid var(--ring);border-radius:14px;padding:14px 14px 8px}
.mcard .h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.mcard .h > span:first-child{display:flex;align-items:center}
.mcard .v{display:flex;align-items:baseline;gap:8px;margin:8px 0 2px}
.mcard .v b{font-size:26px;font-weight:650;letter-spacing:-0.02em}
.mcard .v span{font-size:12px;color:var(--muted)}
.mchart{height:130px;margin:6px -4px 0}
details{font-size:12px;color:var(--muted);margin:4px 0 4px}
details summary{cursor:pointer;padding:4px 0}
details table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin-top:4px}
details td{padding:3px 0;border-top:1px solid var(--line)}
details td:last-child{text-align:right;color:var(--ink-2)}

/* foot */
.foot{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 2px}
.foot p{margin:0;max-width:640px;line-height:1.5}
.foot .btns{display:flex;gap:8px;flex-wrap:wrap}
.file{display:inline-flex;align-items:center}

/* empty */
.empty{max-width:560px;margin:40px auto;text-align:left}
.empty h1{font-size:24px;margin:0 0 8px;letter-spacing:-0.02em}
.empty p{color:var(--ink-2);line-height:1.55;font-size:14px}
.empty input{width:100%;margin:10px 0 14px;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit;font-size:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:40}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--ring);overflow-y:auto;padding:0 20px 120px;animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 12px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h b{font-size:17px}
.sheet input[type=date]{background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;padding:7px 10px;color:var(--ink);font:inherit;font-size:14px}
.sgroup{margin-top:22px}
.sgroup h3{font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow label{display:flex;align-items:center;font-size:14px}
.stepper{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;overflow:hidden}
.stepper button{background:transparent;border:0;width:38px;height:36px;font-size:18px;color:var(--ink-2)}
.stepper button:active{background:rgba(255,255,255,0.06)}
.stepper input{width:58px;text-align:center;background:transparent;border:0;color:var(--ink);font:inherit;font-size:15px;font-variant-numeric:tabular-nums}
.numin{width:130px;text-align:right;background:var(--surface-2);border:1px solid var(--ring);border-radius:10px;padding:8px 10px;color:var(--ink);font:inherit;font-size:14px;font-variant-numeric:tabular-nums}
.sheet-f{position:fixed;bottom:0;right:0;width:min(460px,100vw);padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--surface) 30%);z-index:3}
.sheet-f .primary{width:100%;padding:13px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 8px}

.tip{position:fixed;z-index:60;pointer-events:none;background:#0d0d0d;border:1px solid rgba(255,255,255,0.16);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;color:var(--ink-2);min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,0.5)}
.tip b{color:var(--ink);font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#0d0d0d;font-weight:600;font-size:14px;border-radius:999px;padding:10px 18px;box-shadow:0 8px 24px rgba(0,0,0,0.5)}

@media (max-width:760px){
  .wrap{padding:0 14px}
  .now-grid,.week-grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .card{padding:16px;border-radius:16px}
  .rm-scroll{margin:0 -16px;padding:0 16px}
  .rm{grid-template-columns:78px repeat(var(--cols),minmax(200px,1fr));min-width:calc(78px + var(--cols) * 208px)}
  .rm-t{font-size:13px}
  .today-date{font-size:26px}
  .big{font-size:38px}
  #btnLink{display:none}
}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="title" id="title">Scoreboard</div><div class="north" id="north"></div></div>
  <div class="actions"><button class="ghost" id="btnLink" type="button">Copy link</button><button class="primary" id="btnLog" type="button" hidden>Log</button></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const LS_KEY = 'scoreboard.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const daysUntil = k => Math.round((parseD(k) - parseD(dkey(new Date()))) / 86400000);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const fmtDate = k => { const d = parseD(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtDateY = k => { const d = parseD(k); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const toMin = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const fmtTime = hm => { let [h, m] = hm.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; };
const r2 = n => Math.round(n * 100) / 100;
const fmtH = h => `${r2(h)}h`;
const fmtNum = n => Math.round(n).toLocaleString('en-US');
const fmtVal = (m, v) => {
  if (m && m.unit === 'inr') {
    if (v >= 100000) { const l = v / 100000; return `₹${Number.isInteger(r2(l)) ? r2(l) : l.toFixed(1)}L`; }
    return `₹${r2(v / 1000)}k`;
  }
  return fmtNum(v);
};
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
const HEX = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300'];

let S = null;
let range = localStorage.getItem('scoreboard.range') || null;

/* ---------- storage: the link is the save file ---------- */
const b64u = {
  enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const bin = atob(str); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
};
async function pack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ('CompressionStream' in window) {
    const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
    return 'z.' + b64u.enc(new Uint8Array(buf));
  }
  return 'j.' + b64u.enc(raw);
}
async function unpack(str) {
  const kind = str.slice(0, 2), bytes = b64u.dec(str.slice(2));
  if (kind === 'z.') {
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
const blank = () => ({ v: 1, u: 0, plan: null, days: {}, log: {}, done: {} });
async function load() {
  let fromHash = null, fromLS = null;
  const h = location.hash.slice(1);
  if (h.startsWith('s=')) { try { fromHash = await unpack(h.slice(2)); } catch (e) { console.warn('bad link', e); } }
  try { const raw = localStorage.getItem(LS_KEY); if (raw) fromLS = JSON.parse(raw); } catch (e) {}
  let pick = fromLS;
  if (fromHash && fromHash.plan && (!fromLS || !fromLS.plan || (fromHash.u || 0) >= (fromLS.u || 0))) pick = fromHash;
  S = Object.assign(blank(), pick || {});
  if (S.plan) { localStorage.setItem(LS_KEY, JSON.stringify(S)); await writeHash(); }
  render();
}
async function writeHash() { history.replaceState(null, '', '#s=' + await pack(S)); }
async function save(msg) {
  S.u = Date.now();
  localStorage.setItem(LS_KEY, JSON.stringify(S));
  await writeHash();
  render();
  if (msg) toast(msg);
}
window.addEventListener('hashchange', load);

/* ---------- derived numbers ---------- */
const P = () => S.plan;
const ownTracks = () => P().tracks.filter(t => !t.noHours);
const trackColor = k => { const t = P().tracks.find(x => x.k === k); return t ? COLORS[(t.color || 1) - 1] : 'var(--paid)'; };
const trackHex = k => { const t = P().tracks.find(x => x.k === k); return t ? HEX[(t.color || 1) - 1] : '#5f5e5a'; };
const dayOf = k => S.days[k] || { h: {}, c: {} };
const ownHours = k => ownTracks().reduce((a, t) => a + ((dayOf(k).h || {})[t.k] || 0), 0);
const paidHours = k => (P().paid || []).reduce((a, p) => a + ((dayOf(k).h || {})[p.k] || 0), 0);
const dailyTarget = () => ownTracks().reduce((a, t) => a + t.daily, 0);
function sumCount(k, from, to) {
  let t = 0;
  for (const [d, v] of Object.entries(S.days)) if (d >= from && d <= to) t += ((v.c || {})[k] || 0);
  return t;
}
function metricSeries(m) {
  const base = [m.baseDate || P().start, m.base || 0];
  if (m.from && m.from.startsWith('count:')) {
    const k = m.from.slice(6);
    const ds = Object.keys(S.days).filter(d => d > base[0] && ((S.days[d].c || {})[k] || 0) > 0).sort();
    let run = base[1]; const pts = [base];
    for (const d of ds) { run += S.days[d].c[k]; pts.push([d, run]); }
    return pts;
  }
  const pts = [base, ...(S.log[m.k] || []).filter(p => p[0] >= base[0])];
  pts.sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  return pts;
}
const metricNow = m => { const s = metricSeries(m); return s[s.length - 1][1]; };
const metricUpdated = m => metricSeries(m).length > 1;
function targetPath(m) {
  const pts = [[m.baseDate || P().start, m.base || 0]];
  for (const cp of P().checkpoints) if (m.t && m.t[cp.id] != null) pts.push([cp.d, m.t[cp.id]]);
  return pts;
}
function interp(path, k) {
  const t = parseD(k).getTime();
  if (t <= parseD(path[0][0]).getTime()) return path[0][1];
  for (let i = 1; i < path.length; i++) {
    const a = parseD(path[i - 1][0]).getTime(), b = parseD(path[i][0]).getTime();
    if (t <= b) return path[i - 1][1] + (path[i][1] - path[i - 1][1]) * (t - a) / (b - a);
  }
  return path[path.length - 1][1];
}
const nextCheckpoint = k => P().checkpoints.find(cp => cp.d >= k) || null;
function msDone(ms) {
  if (S.done[ms.id]) return true;
  if (ms.auto) { const m = P().metrics.find(x => x.k === ms.auto.m); if (m && metricNow(m) >= ms.auto.gte) return true; }
  return false;
}
function pill(kind, text) {
  const ico = kind === 'good' ? '✓' : kind === 'warn' ? '!' : kind === 'late' ? '!' : '·';
  return `<span class="pill ${kind}"><span aria-hidden="true">${ico}</span>${esc(text)}</span>`;
}

/* ---------- views ---------- */
function render() {
  const app = $('#app');
  hideTip();
  if (!S.plan) { app.innerHTML = emptyView(); bindEmpty(); $('#btnLog').hidden = true; return; }
  $('#btnLog').hidden = false;
  $('#title').textContent = P().title || 'Scoreboard';
  $('#north').textContent = P().north || '';
  document.title = P().title || 'Scoreboard';
  if (!range) range = (P().ranges && P().ranges[0] && P().ranges[0].k) || 'all';
  app.innerHTML = nowView() + weekView() + roadmapView() + forecastView() + footView();
  drawWeek(); drawForecast(); bindMain();
}

function emptyView() {
  return `<section class="card empty">
    <h1>No plan loaded</h1>
    <p>This scoreboard keeps its plan and history inside its own link and in this browser. Nothing is sent to a server. Paste your personal link below to load it.</p>
    <input id="impLink" placeholder="Paste your scoreboard link" autocomplete="off">
    <button class="primary" id="impGo" type="button">Load</button>
  </section>`;
}
function bindEmpty() {
  $('#impGo').onclick = () => {
    const v = $('#impLink').value.trim(); const i = v.indexOf('#s=');
    if (i < 0) { toast('That link has no plan in it'); return; }

}

function nowView() {
  const now = new Date(), tk = dkey(now), p = P();
  const cp = nextCheckpoint(tk);
  const left = cp ? daysUntil(cp.d) : null;
  const isRest = (p.restDays || []).includes(now.getDay());
  const mins = now.getHours() * 60 + now.getMinutes();
  const own = ownHours(tk), target = dailyTarget();
  let blocksHtml = '';
  if (isRest) {
    const first = p.blocks[0];
    blocksHtml = `<div class="rest">Rest day. Tomorrow starts at ${fmtTime(first.s)} with ${esc(blockName(first))}.</div>`;
  } else {
    const todays = p.blocks.filter(b => !b.days || b.days.includes(now.getDay()));
    const groups = {};
    todays.forEach((b, i) => { const g = toMin(b.s) < 720 ? 'Morning' : 'Afternoon and evening'; (groups[g] = groups[g] || []).push([b, i]); });
    const nowIdx = todays.findIndex(b => mins >= toMin(b.s) && mins < toMin(b.e));
    const nextIdx = nowIdx < 0 ? todays.findIndex(b => toMin(b.s) > mins) : -1;
    blocksHtml = Object.entries(groups).map(([g, list]) => `<div><div class="bgroup-h">${g}</div><div class="brow">${list.map(([b, i]) => {
      const on = i === nowIdx, done = mins >= toMin(b.e), dur = (toMin(b.e) - toMin(b.s)) / 60;
      const tag = on ? '<span class="tag">Now</span>' : i === nextIdx ? '<span class="tag muted">Next</span>' : '';
      return `<div class="blk ${on ? 'on' : ''} ${done && !on ? 'done' : ''}" style="--bc:${trackColor(b.t)}">${tag}
        <div class="t">${fmtTime(b.s)} to ${fmtTime(b.e)}</div>
        <div class="n">${esc(blockName(b))}</div>
        <div class="x">${esc(b.note || '')}${b.note ? ' · ' : ''}${fmtH(dur)}</div></div>`;
    }).join('')}</div></div>`).join('');
  }
  const bars = ownTracks().map(t => {
    const v = (dayOf(tk).h || {})[t.k] || 0;
    return `<div class="tbar" style="--bc:${trackColor(t.k)}"><div class="l"><span><span class="dot" style="background:${trackColor(t.k)}"></span>${esc(t.name)}</span><span>${fmtH(v)} / ${fmtH(t.daily)}</span></div><div class="track"><i style="width:${Math.min(100, t.daily ? v / t.daily * 100 : 0)}%"></i></div></div>`;
  }).join('');
  return `<section class="card">
    <div class="card-h"><h2>Today</h2>${cp ? `<span class="sub">${esc(cp.name)} checkpoint ${left === 0 ? 'is today' : `in ${left} day${left === 1 ? '' : 's'}`}</span>` : ''}</div>
    <div class="now-grid">
      <div>
        <div class="today-date">${DOWL[now.getDay()]}, ${fmtDate(tk)}</div>
        <div style="margin-top:18px" class="big">${fmtH(own)}<small>of ${fmtH(target)} yours today</small></div>
        <div class="today-meta">${paidHours(tk) ? `<span>${fmtH(paidHours(tk))} paid work logged</span>` : ''}<span class="muted">${S.days[tk] ? 'Logged today' : 'Nothing logged yet today'}</span></div>
      </div>
      <div class="blocks">${blocksHtml}<div class="tbars">${bars}</div></div>
    </div>
  </section>`;
}
const trackName = k => {
  const t = P().tracks.find(x => x.k === k); if (t) return t.name;
  return (P().paidLabel) || 'Paid work';
};
const blockName = b => b.name || trackName(b.t);

function weekKeys() { const mon = mondayOf(new Date()); return [...Array(7)].map((_, i) => dkey(addDays(mon, i))); }
function weekView() {
  const p = P(), keys = weekKeys(), tk = dkey(new Date());
  const dayIdx = keys.indexOf(tk);
  const doneDays = Math.min(Math.max(dayIdx, 0), p.workdays);
  const weekTarget = dailyTarget() * p.workdays;
  const own = keys.reduce((a, k) => a + ownHours(k), 0);
  const paid = keys.reduce((a, k) => a + paidHours(k), 0);
  const expH = weekTarget * doneDays / p.workdays;
  const hStatus = own >= weekTarget ? pill('good', 'Done') : own >= expH - 0.01 ? pill('good', 'On pace') : pill('warn', `${fmtH(expH - own)} behind`);
  const perTrack = ownTracks().map(t => {
    const v = keys.reduce((a, k) => a + ((dayOf(k).h || {})[t.k] || 0), 0), tgt = t.daily * p.workdays;
    return `<div class="tbar" style="--bc:${trackColor(t.k)}"><div class="l"><span><span class="dot" style="background:${trackColor(t.k)}"></span>${esc(t.name)}</span><span>${fmtH(v)} / ${fmtH(tgt)}</span></div><div class="track"><i style="width:${Math.min(100, tgt ? v / tgt * 100 : 0)}%"></i></div></div>`;
  }).join('');
  const monthStart = tk.slice(0, 8) + '01';
  const tiles = p.counts.map(c => {
    let v, tgt, exp, per;
    if (c.week) { v = sumCount(c.k, keys[0], keys[6]); tgt = c.week; exp = tgt * doneDays / p.workdays; per = 'this week'; }
    else { v = sumCount(c.k, monthStart, tk); tgt = c.month; const dim = new Date(parseD(tk).getFullYear(), parseD(tk).getMonth() + 1, 0).getDate(); exp = tgt * (parseD(tk).getDate() - 1) / dim; per = 'this month'; }
    const st = v >= tgt ? pill('good', 'Done') : v >= exp - 0.01 ? pill('good', 'On pace') : pill('warn', 'Behind');
    return `<div class="tile" style="--bc:${trackColor(c.track)}"><div class="h"><span class="dot" style="background:${trackColor(c.track)}"></span>${esc(c.name)}</div>
      <div class="v">${v}<small> / ${tgt} ${per}</small></div><div class="track"><i style="width:${Math.min(100, v / tgt * 100)}%"></i></div>${st}</div>`;
  }).join('');
  return `<section class="card">
    <div class="card-h"><h2>This week</h2><span class="sub">${fmtDate(keys[0])} to ${fmtDate(keys[6])}</span></div>
    <div class="week-grid">
      <div>
        <div class="big">${fmtH(own)}<small>of ${fmtH(weekTarget)} yours</small></div>
        <div style="margin:12px 0 18px">${hStatus}</div>
        <div class="tbars" style="grid-template-columns:1fr">${perTrack}</div>
        ${paid ? `<div class="sub" style="margin-top:14px">${fmtH(paid)} on paid work this week</div>` : ''}
      </div>
      <div><div class="weekchart" id="weekChart"></div>
        <div class="legend">${ownTracks().map(t => `<span><span class="dot" style="background:${trackColor(t.k)}"></span>${esc(t.name)}</span>`).join('')}<span><span class="dot" style="background:var(--paid)"></span>${esc(p.paidLabel || 'Paid work')}</span><span class="muted">dashed line: ${fmtH(dailyTarget())} a day</span></div>
      </div>
    </div>
    <div class="counts">${tiles}</div>
  </section>`;
}

function roadmapView() {
  const p = P(), tk = dkey(new Date()), cur = nextCheckpoint(tk);
  const cps = p.checkpoints;
  const head = `<div></div>` + cps.map(cp => {
    const isCur = cur && cp.id === cur.id, left = daysUntil(cp.d);
    return `<div class="rm-h ${isCur ? 'cur' : ''} ${cp.d < tk ? 'past' : ''}"><b>${esc(cp.name)}</b><span>${isCur ? (left === 0 ? 'Today' : `${left} day${left === 1 ? '' : 's'} left`) : cp.d < tk ? 'Passed' : ''}</span></div>`;
  }).join('');
  const rows = p.tracks.map(t => `<div class="rm-t"><span class="dot" style="background:${trackColor(t.k)}"></span>${esc(t.name)}</div>` + cps.map(cp => {
    const items = p.milestones.filter(ms => ms.track === t.k && ms.cp === cp.id);
    const isCur = cur && cp.id === cur.id;
    return `<div class="rm-c ${isCur ? 'cur' : ''}">${items.map(ms => msItem(ms, cp, tk)).join('')}</div>`;
  }).join('')).join('');
  const all = p.milestones.length, done = p.milestones.filter(msDone).length;
  return `<section class="card">
    <div class="card-h"><h2>Roadmap</h2><span class="sub">${done} of ${all} done · dashed boxes tick themselves from your numbers</span></div>
    <div class="rm-scroll"><div class="rm" style="--cols:${cps.length}">${head}${rows}</div></div>
  </section>`;
}
function msItem(ms, cp, tk) {
  const done = msDone(ms), late = !done && cp.d < tk;
  let extra = '';
  if (ms.auto) {
    const m = P().metrics.find(x => x.k === ms.auto.m);
    if (m) extra = `<span class="auto">${fmtVal(m, metricNow(m))} of ${fmtVal(m, ms.auto.gte)}</span>`;
  }
  if (ms.due) extra += `<span class="auto">due ${fmtDate(ms.due)}</span>`;
  const inner = `<span class="box">${done ? '✓' : ''}</span><span><span class="txt">${esc(ms.text)}</span>${extra}</span>`;
  const cls = `ms ${done ? 'done' : ''} ${late ? 'late' : ''} ${ms.auto ? 'auto-ms' : ''}`;
  return ms.auto ? `<div class="${cls}">${inner}</div>` : `<button type="button" class="${cls}" data-ms="${esc(ms.id)}" aria-pressed="${done}">${inner}</button>`;
}

function rangeEnd() {
  const r = (P().ranges || []).find(x => x.k === range);
  return r ? r.end : P().checkpoints[P().checkpoints.length - 1].d;
}
function forecastView() {
  const p = P();
  const seg = (p.ranges || []).length ? `<div class="seg" role="group" aria-label="Time range">${p.ranges.map(r => `<button type="button" data-range="${esc(r.k)}" class="${range === r.k ? 'on' : ''}" aria-pressed="${range === r.k}">${esc(r.name)}</button>`).join('')}</div>` : '';
  const tk = dkey(new Date());
  const cards = p.metrics.map(m => {
    const nowV = metricNow(m), path = targetPath(m);
    const nextT = p.checkpoints.find(cp => cp.d >= tk && m.t && m.t[cp.id] != null);
    const want = interp(path, tk);
    let st;
    if (!metricUpdated(m)) st = pill('idle', 'No update yet');
    else if (nowV >= want) st = pill('good', `Ahead by ${fmtVal(m, nowV - want)}`);
    else st = pill('warn', `Behind by ${fmtVal(m, want - nowV)}`);
    const series = metricSeries(m);
    const rows = series.slice().reverse().slice(0, 12).map(([d, v]) => `<tr><td>${fmtDate(d)}</td><td>${fmtVal(m, v)}</td></tr>`).join('');
    return `<div class="mcard">
      <div class="h"><span><span class="dot" style="background:${trackColor(m.track)}"></span>${esc(m.name)}</span>${st}</div>
      <div class="v"><b>${fmtVal(m, nowV)}</b>${nextT ? `<span>target ${fmtVal(m, m.t[nextT.id])} by ${esc(nextT.name)}</span>` : ''}</div>
      <div class="mchart" data-m="${esc(m.k)}"></div>
      <details><summary>Numbers</summary><table>${rows}</table></details>
    </div>`;
  }).join('');
  return `<section class="card">
    <div class="card-h"><h2>Forecast</h2>${seg}</div>
    <div class="mgrid">${cards}</div>
    <div class="legend" style="margin-top:12px"><span>solid line: actual</span><span>dashed line: target path</span><span>rings: checkpoint targets</span></div>
  </section>`;
}
function footView() {
  const when = S.u ? new Date(S.u) : null;
  return `<footer class="foot">
    <p>Your plan and history live in this page's link and in this browser. Nothing is sent to a server. Log on one device, then use Copy link to carry the latest to another.${when ? ` Last saved ${fmtDate(dkey(when))}, ${fmtTime(pad(when.getHours()) + ':' + pad(when.getMinutes()))}.` : ''}</p>
    <div class="btns"><button type="button" class="ghost" id="btnCopy2">Copy link</button><button type="button" class="ghost" id="btnExport">Export JSON</button><label class="ghost file">Import JSON<input type="file" id="impFile" accept="application/json" hidden></label></div>
  </footer>`;

/* ---------- charts ---------- */
const tip = () => $('#tip');
function showTip(html, x, y) {
  const el = tip(); el.innerHTML = html; el.hidden = false;
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = x + 14, top = y - h - 12;
  if (left + w > window.innerWidth - 8) left = x - w - 14;
  if (top < 8) top = y + 16;
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function hideTip() { const el = tip(); if (el) el.hidden = true; }

function drawWeek() {
  const el = $('#weekChart'); if (!el) return;
  const p = P(), keys = weekKeys(), tk = dkey(new Date());
  const W = el.clientWidth || 500, H = 170, pl = 30, pr = 6, pt = 10, pb = 24;
  const tracks = ownTracks();
  const totals = keys.map(k => ownHours(k) + paidHours(k));
  const max = Math.max(dailyTarget() + 2, ...totals);
  const top = Math.ceil(max / 2) * 2;
  const Y = v => pt + (H - pt - pb) * (1 - v / top);
  const band = (W - pl - pr) / 7, bw = Math.min(40, band * 0.56);
  let g = '';
  for (let v = 0; v <= top; v += top > 8 ? 4 : 2) {
    g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v === 0 ? '#383835' : '#2c2c2a'}" stroke-width="1"/>`;
    g += `<text x="${pl - 8}" y="${Y(v) + 4}" fill="#898781" font-size="10" text-anchor="end">${v}h</text>`;
  }
  let bars = '', defs = '';
  keys.forEach((k, i) => {
    const x = pl + band * i + (band - bw) / 2;
    const day = dayOf(k).h || {};
    const segs = [...tracks.map(t => [t.k, day[t.k] || 0, trackHex(t.k)]), ...(p.paid || []).map(q => [q.k, day[q.k] || 0, '#5f5e5a'])].filter(s => s[1] > 0);
    const total = segs.reduce((a, s) => a + s[1], 0);
    if (total > 0) {
      const yTop = Y(total), r = Math.min(4, bw / 2, Y(0) - yTop);
      defs += `<clipPath id="wc${i}"><path d="M${x},${Y(0)} V${yTop + r} a${r},${r} 0 0 1 ${r},${-r} H${x + bw - r} a${r},${r} 0 0 1 ${r},${r} V${Y(0)} Z"/></clipPath>`;
      let acc = 0, inner = '';
      segs.forEach((s, j) => {
        const y0 = Y(acc), y1 = Y(acc + s[1]);
        const gap = j < segs.length - 1 ? 2 : 0;
        inner += `<rect x="${x}" y="${y1 + gap}" width="${bw}" height="${Math.max(0, y0 - y1 - gap)}" fill="${s[2]}"/>`;
        acc += s[1];
      });
      bars += `<g clip-path="url(#wc${i})">${inner}</g>`;
    }
    const d = parseD(k);
    bars += `<text x="${x + bw / 2}" y="${H - 6}" fill="${k === tk ? '#ffffff' : '#898781'}" font-size="11" font-weight="${k === tk ? 700 : 400}" text-anchor="middle">${DOW[d.getDay()]}</text>`;
    bars += `<rect class="hit" data-i="${i}" x="${pl + band * i}" y="${pt}" width="${band}" height="${H - pt - pb}" fill="transparent"/>`;
  });
  const ty = Y(dailyTarget());
  g += `<line x1="${pl}" x2="${W - pr}" y1="${ty}" y2="${ty}" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Hours by day this week"><defs>${defs}</defs>${g}${bars}</svg>`;
  $$('.hit', el).forEach(r => {
    const i = +r.dataset.i, k = keys[i];
    const html = () => {
      const day = dayOf(k).h || {};
      const lines = [...tracks.map(t => [t.name, day[t.k] || 0]), ...(p.paid || []).map(q => [q.name, day[q.k] || 0])];
      return `<b>${DOWL[parseD(k).getDay()]}, ${fmtDate(k)}</b>` + lines.map(([n, v]) => `<div class="r"><span>${esc(n)}</span><span>${fmtH(v)}</span></div>`).join('') + `<div class="r"><span>Yours</span><b>${fmtH(ownHours(k))}</b></div>`;
    };
    r.addEventListener('pointermove', e => showTip(html(), e.clientX, e.clientY));
    r.addEventListener('pointerleave', hideTip);
  });
}

function drawForecast() {
  $$('.mchart').forEach(el => {
    const m = P().metrics.find(x => x.k === el.dataset.m); if (!m) return;
    lineChart(el, m);
  });
}
function lineChart(el, m) {
  const W = el.clientWidth || 300, H = 130, pl = 10, pr = 14, pt = 16, pb = 22;
  const start = m.baseDate || P().start, end = rangeEnd(), tk = dkey(new Date());
  const t0 = parseD(start).getTime(), t1 = parseD(end).getTime();
  const X = k => pl + (W - pl - pr) * (parseD(k).getTime() - t0) / (t1 - t0);
  const tp = targetPath(m);
  const tpIn = tp.filter(q => q[0] <= end);
  if (tp.some(q => q[0] > end)) tpIn.push([end, interp(tp, end)]);
  const act = metricSeries(m).filter(q => q[0] <= end);
  const vals = [...tpIn.map(q => q[1]), ...act.map(q => q[1])];
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) hi = lo + 1;
  const padV = (hi - lo) * 0.14; lo = Math.max(0, lo - padV); hi = hi + padV;
  const Y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const col = trackHex(m.track);
  let s = '';
  s += `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="#383835"/>`;
  P().checkpoints.filter(cp => cp.d <= end && cp.d > start).forEach(cp => {
    const x = X(cp.d);
    s += `<line x1="${x}" x2="${x}" y1="${pt - 6}" y2="${H - pb}" stroke="#2c2c2a" stroke-dasharray="2 3"/>`;
    s += `<text x="${x}" y="${H - 7}" fill="#898781" font-size="10" text-anchor="${x > W - 40 ? 'end' : 'middle'}">${esc(cp.short || cp.name)}</text>`;
  });
  if (tk >= start && tk <= end) {
    const x = X(tk);
    s += `<line x1="${x}" x2="${x}" y1="${pt - 6}" y2="${H - pb}" stroke="#c3c2b7" opacity="0.35"/>`;
  }
  s += `<polyline points="${tpIn.map(q => `${X(q[0])},${Y(q[1])}`).join(' ')}" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  tpIn.slice(1).forEach(q => {
    if (!P().checkpoints.some(cp => cp.d === q[0])) return;
    const x = X(q[0]), y = Y(q[1]);
    s += `<circle cx="${x}" cy="${y}" r="4" fill="#1a1a19" stroke="#c3c2b7" stroke-width="1.5"/>`;
    s += `<text x="${x > W - 50 ? x - 6 : x}" y="${y - 8}" fill="#c3c2b7" font-size="10" text-anchor="${x > W - 50 ? 'end' : 'middle'}">${fmtVal(m, q[1])}</text>`;
  });
  if (act.length > 1) s += `<polyline points="${act.map(q => `${X(q[0])},${Y(q[1])}`).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = act[act.length - 1];
  if (last) s += `<circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4.5" fill="${col}" stroke="#232321" stroke-width="2"/>`;
  s += `<line class="xh" x1="0" x2="0" y1="${pt - 6}" y2="${H - pb}" stroke="#ffffff" opacity="0" />`;
  s += `<rect class="hit" x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(m.name)}: actual against target">${s}</svg>`;
  const hit = $('.hit', el), xh = $('.xh', el);
  const onMove = e => {
    const rect = el.getBoundingClientRect();
    const px = Math.min(Math.max(e.clientX - rect.left, pl), W - pr);
    const t = t0 + (px - pl) / (W - pl - pr) * (t1 - t0);
    const k = dkey(new Date(t));
    xh.setAttribute('x1', X(k)); xh.setAttribute('x2', X(k)); xh.setAttribute('opacity', '0.4');
    const a = metricSeries(m).filter(q => q[0] <= k);
    const actual = a.length && k <= tk ? a[a.length - 1][1] : null;
    showTip(`<b>${fmtDateY(k)}</b><div class="r"><span>Target</span><span>${fmtVal(m, interp(tp, k))}</span></div>${actual != null ? `<div class="r"><span>Actual</span><b>${fmtVal(m, actual)}</b></div>` : ''}`, e.clientX, e.clientY);
  };
  hit.addEventListener('pointermove', onMove);
  hit.addEventListener('pointerdown', onMove);
  hit.addEventListener('pointerleave', () => { xh.setAttribute('opacity', '0'); hideTip(); });
}

/* ---------- log sheet ---------- */
function stepper(kind, k, val, step) {
  return `<div class="stepper" data-kind="${kind}" data-k="${esc(k)}" data-step="${step}"><button type="button" data-d="-1" aria-label="Less">&minus;</button><input inputmode="decimal" value="${val || 0}" aria-label="${esc(k)}"><button type="button" data-d="1" aria-label="More">+</button></div>`;
}
function openSheet(k) {
  closeSheet();
  const p = P(); k = k || dkey(new Date());
  const day = dayOf(k), h = day.h || {}, c = day.c || {};
  const hoursRows = [...ownTracks().map(t => [t.k, t.name, trackColor(t.k)]), ...(p.paid || []).map(q => [q.k, q.name, 'var(--paid)'])]
    .map(([key, name, color]) => `<div class="srow"><label><span class="dot" style="background:${color}"></span>${esc(name)}</label>${stepper('h', key, h[key], 0.25)}</div>`).join('');
  const countRows = p.counts.map(ct => `<div class="srow"><label><span class="dot" style="background:${trackColor(ct.track)}"></span>${esc(ct.name)}</label>${stepper('c', ct.k, c[ct.k], 1)}</div>`).join('');
  const numRows = p.metrics.filter(m => !m.from).map(m => {
    const at = (S.log[m.k] || []).find(q => q[0] === k);
    return `<div class="srow"><label><span class="dot" style="background:${trackColor(m.track)}"></span>${esc(m.name)}</label><input class="numin" data-m="${esc(m.k)}" inputmode="decimal" placeholder="${esc(fmtVal(m, metricNow(m)))}" value="${at ? at[1] : ''}"></div>`;
  }).join('');
  const wrap = document.createElement('div');
  wrap.id = 'sheetWrap';
  wrap.innerHTML = `<div class="scrim" id="scrim"></div>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Log">
    <div class="sheet-h"><b>Log</b><input type="date" id="logDate" value="${k}"><button type="button" class="ghost" id="sheetX">Close</button></div>
    <div class="sgroup"><h3>Hours</h3><p class="hint">From your Session app, in quarter hours.</p>${hoursRows}</div>
    <div class="sgroup"><h3>Counts</h3>${countRows}</div>
    <div class="sgroup"><h3>Numbers</h3><p class="hint">Only when they change. Leave blank to keep the last one. Income takes 80000, 80k or 2.2L.</p>${numRows}</div>
    <div class="sheet-f"><button class="primary" type="submit">Save</button></div>
  </form>`;
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';
  $('#scrim').onclick = closeSheet; $('#sheetX').onclick = closeSheet;
  $('#logDate').onchange = e => { if (e.target.value) openSheet(e.target.value); };
  $$('.stepper', wrap).forEach(st => {
    const inp = $('input', st), step = parseFloat(st.dataset.step);
    $$('button', st).forEach(b => b.onclick = () => {
      const v = Math.max(0, (parseFloat(inp.value) || 0) + step * (+b.dataset.d));
      inp.value = r2(v);
    });
    inp.onfocus = () => inp.select();
  });
  $('#sheet').onsubmit = async e => {
    e.preventDefault();
    const nh = {}, nc = {};
    $$('.stepper[data-kind="h"]', wrap).forEach(st => { const v = r2(parseFloat($('input', st).value) || 0); if (v > 0) nh[st.dataset.k] = v; });
    $$('.stepper[data-kind="c"]', wrap).forEach(st => { const v = Math.round(parseFloat($('input', st).value) || 0); if (v > 0) nc[st.dataset.k] = v; });
    if (Object.keys(nh).length || Object.keys(nc).length) S.days[k] = { h: nh, c: nc }; else delete S.days[k];
    $$('.numin', wrap).forEach(inp => {
      const raw = inp.value.trim(); const arr = (S.log[inp.dataset.m] = S.log[inp.dataset.m] || []);
      const i = arr.findIndex(q => q[0] === k);
      if (!raw) { if (i >= 0) arr.splice(i, 1); return; }
      const v = parseAmount(raw); if (v == null) return;
      if (i >= 0) arr[i] = [k, v]; else arr.push([k, v]);
      arr.sort((a, b) => a[0] < b[0] ? -1 : 1);
    });
    closeSheet();
    await save('Saved');
  };
}
function parseAmount(raw) {
  const s = raw.replace(/[₹,\s]/g, '').toLowerCase();
  const m = s.match(/^(\d+(?:\.\d+)?)(k|l|lakh)?$/); if (!m) return null;
  let v = parseFloat(m[1]); if (m[2] === 'k') v *= 1000; if (m[2] === 'l' || m[2] === 'lakh') v *= 100000;
  return v;
}
function closeSheet() { const w = $('#sheetWrap'); if (w) w.remove(); document.body.style.overflow = ''; }

/* ---------- wiring ---------- */
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }
async function copyLink() {
  try { await navigator.clipboard.writeText(location.href); toast('Link copied. It holds everything.'); }
  catch (e) { prompt('Copy this link', location.href); }
}
function bindMain() {
  $$('button.ms').forEach(b => b.onclick = async () => {
    const id = b.dataset.ms;
    if (S.done[id]) delete S.done[id]; else S.done[id] = dkey(new Date());
    await save();
  });
  $$('.seg button').forEach(b => b.onclick = () => { range = b.dataset.range; localStorage.setItem('scoreboard.range', range); render(); });
  $('#btnCopy2').onclick = copyLink;
  $('#btnExport').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = `scoreboard-${dkey(new Date())}.json`; a.click();
  };
  $('#impFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const obj = JSON.parse(await f.text()); if (!obj.plan) throw new Error('no plan'); S = Object.assign(blank(), obj); await save('Imported'); }
    catch (err) { toast('That file is not a scoreboard export'); }
  };
}
$('#btnLog').onclick = () => openSheet();
$('#btnLink').onclick = copyLink;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S && S.plan) { drawWeek(); drawForecast(); } }, 150); });
setInterval(() => { if (S && S.plan && !$('#sheetWrap')) render(); }, 5 * 60 * 1000);
load();
})();
</script>
</body>
